# Name of this app
service: fizzy
image: fizzy


#-- About your deployment --#

# Where to deploy fizzy
servers:
  web:
    - ctb-tickets.webranger.consulting  # Set your server name here

# How you connect to your server
ssh:
  user: root  # If you use a different username to SSH to your server, specify it here

# Automatic SSL
proxy:
  ssl: true                # Set this to false if you *don't* want SSL
  host: ctb-tickets.webranger.consulting  # Set your server name here to use automatic SSL
  app_port: 3000

# Your application configuration (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    BASE_URL: https://ctb-tickets.webranger.consulting # The public URL of your Fizzy instance
    MAILER_FROM_ADDRESS: support@webranger.consulting # The email "from" address that Fizzy sends email from
    SMTP_ADDRESS: mail.purelymail.com # The SMTP server you'll use to send email
    MULTI_TENANT: true # Set to true to allow multiple accounts to sign up
    SOLID_QUEUE_IN_PUMA: true # Run background jobs in the app container
    HTTP_PORT: 3000   # Thruster's public port; kamal-proxy and the HEALTHCHECK both use this
    TARGET_PORT: 3001 # Puma's port; must differ from HTTP_PORT or Thruster proxies to itself


#-- General configuration --#

# Use a local registry to deploy
registry:
  server: localhost:5555

# Handy aliases for interacting with your deployment. For eaxmple: `bin/kamal console` will connect to a
# Rails console in production.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "fizzy_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
# asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
